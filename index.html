<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Tropical Trail Wind Forecast</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>South Tropical Trail Wind Forecast</h1>
        <p>Banana River — Merritt Island, Florida</p>
    </header>

    <main>
        <section>
            <h2 id="today-heading">Today's Wind Forecast</h2>
            <p id="forecast-status">Loading current wind forecast...</p>

            <div id="today-forecast"></div>
        </section>

        <section>
            <h2>7-Day Best Wind Forecast</h2>
            <div id="seven-day-forecast"></div>
        </section>
    </main>

    <footer>
        <p>Wind data provided by Open-Meteo GFS</p>
</footer>

<script src="script.js"></script>

</body>
</html>
